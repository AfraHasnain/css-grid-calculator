<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: linear-gradient(135deg, #ff6a9d, #a86edb);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    .calculator{
        background: #ffe4ef;
        width: 320px;
        padding: 22px;
        border-radius: 24px;
        border: 1px solid white;
        box-shadow: 0 20px 40px rgb(0, 0, 0, 0.2);
    }

    .display{
        background: white;
        height: 75px;
        border-radius: 14px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding-right: 15px;
        font-size: 34px;
        font-weight: bold;
        color: #ff3d7a;
        margin-bottom: 18px;
    }

    .buttons{
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    button{
        height: 58px;
        border-radius: 14px;
        border: none;
        background: white;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        color: #444;
        transition: all 0.3s ease;
    }

    button:hover{
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    button:active{
        transform: scale(0.95);
    }
    button:focus{
        outline: none;
    }
    button:focus-visible{
        outline: none;
    }
    .func{
        background: #ffd1e2;
        color: #ff3d7a;
    }
    .func:hover{
        background: #ffb9d3;
    }
    .op{
        background: #ff6a9d;
        color: white;
        font-size: 22px;
    }
    .op:hover{
        background: #ff4a8a;
    }
    .equal{
        background: #ff0a64;
        color: white;
        grid-column: span 2;
        font-size: 24px;
    }
    .equal:hover{
        background: #fc4787;
        box-shadow: 0 6px 15px rgba(168, 110, 219, 0.4);
    }
    .num:hover{
        background: white;
    }
</style>
<body>
    <div class="calculator">
        <div class="display">0</div>
            <div class="buttons">
                <button class="func">AC</button>
                <button class="func">C</button>
                <button class="func">%</button>
                <button class="op">&divide;</button>

                <button class="num">7</button>
                <button class="num">8</button>
                <button class="num">9</button>
                <button class="op">&times;</button>

                <button class="num">4</button>
                <button class="num">5</button>
                <button class="num">6</button>
                <button class="op">&minus;</button>

                <button class="num">1</button>
                <button class="num">2</button>
                <button class="num">3</button>
                <button class="op">&plus;</button>

                <button class="num">0</button>
                <button class="num">.</button>
                <button class="equal">&equals;</button>
            </div>
    </div>
</body>
</html>
